# Site
title: "Kyungbin's Notes"
description: >-
  A personal knowledge base on software engineering, AI agents, and the
  practical details of shipping things.
author: "Kyungbin Lee"
author_role: "Forward Deployed Engineer"
author_image: /assets/images/gpt-profil.jpeg
github_username: dlrudqls99
url: "https://dlrudqls99.github.io"
baseurl: ""

# Build
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
permalink: /:categories/:title/
include:
  - _pages
exclude:
  - .harness
  - harness
  - Gemfile
  - Gemfile.lock
  - README.md
  - node_modules
  - vendor

plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-include-cache
  - jekyll-remote-theme

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: default

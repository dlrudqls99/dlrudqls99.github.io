<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title and page.url != '/' %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | strip_newlines | truncate: 160 }}">
  <script>try{document.documentElement.dataset.theme=localStorage.getItem('theme')||'dark'}catch(e){}</script>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  {% feed_meta %}
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="topbar">
    <button class="icon-btn" id="nav-toggle" aria-label="Toggle navigation" aria-expanded="false">
      <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <a href="{{ '/' | relative_url }}" class="topbar-title">{{ site.title }}</a>
    <button class="icon-btn" data-search-open aria-label="Search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    </button>
  </header>

  <div class="shell">
    <aside class="sidebar" id="sidebar">
      {% include sidebar.html %}
    </aside>
    <div class="backdrop" id="backdrop"></div>

    <main class="main" id="main">
      <div class="content">
        {{ content }}
      </div>
      {% if page.layout == 'post' %}
      <aside class="toc" id="toc" aria-label="On this page">
        <p class="toc-title">On this page</p>
        <ul id="toc-list"></ul>
      </aside>
      {% endif %}
    </main>
  </div>

  <dialog id="palette" class="palette">
    <input id="palette-input" type="search" placeholder="Search notes…" autocomplete="off" spellcheck="false" aria-label="Search notes">
    <ul id="palette-list" role="listbox"></ul>
    <p class="palette-hint"><kbd>↑</kbd><kbd>↓</kbd> navigate <kbd>↵</kbd> open <kbd>esc</kbd> close</p>
  </dialog>

  <script src="{{ '/assets/js/kb.js' | relative_url }}" defer></script>
</body>
</html>
